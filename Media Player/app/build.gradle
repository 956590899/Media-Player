plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
}

// 加载签名属性文件
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.mediaplayer.plus'
    compileSdk 35

    defaultConfig {
        applicationId "com.mediaplayer.plus"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (keystoreProperties.size() > 0) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        compose true
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3

    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.compose.material:material-icons-extended:1.7.8"
    
    implementation "io.coil-kt:coil-compose:2.6.0"
    implementation "io.coil-kt:coil-video:2.6.0"

    implementation "androidx.media:media:1.7.0"
    implementation "eu.agno3.jcifs:jcifs-ng:2.1.10"
    implementation "org.bouncycastle:bcprov-jdk18on:1.78.1"

    implementation "androidx.media3:media3-exoplayer:1.5.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.5.1"
    implementation "androidx.media3:media3-exoplayer-dash:1.5.1"
    implementation "androidx.media3:media3-exoplayer-smoothstreaming:1.5.1"
    implementation "androidx.media3:media3-exoplayer-rtsp:1.5.1"
    implementation "androidx.media3:media3-database:1.5.1"
    implementation "androidx.media3:media3-datasource:1.5.1"
    implementation "androidx.media3:media3-ui:1.5.1"

    // Libass 字幕渲染支持
    implementation "io.github.peerless2012:ass-media:0.5.0"
    implementation "io.github.peerless2012:ass:0.5.0"

    // Jellyfin 预编译的 FFmpeg 原生库（含 media3-decoder-ffmpeg + libffmpeg.so，支持 AC3/E-AC3/DTS/FLAC/Opus/Vorbis）
    implementation "org.jellyfin.media3:media3-ffmpeg-decoder:1.5.0+1"

    // DLNA / UPnP 投屏
    implementation "com.yinnho.upnpcast:upnpcast:1.1.2"
    // 本地 HTTP 文件服务器（DLNA 投屏将本地文件转为 HTTP URL）
    implementation "org.nanohttpd:nanohttpd:2.3.1"

    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest
}
